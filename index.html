<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CTS AITT Mains Examination</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f5f5;font-family:Arial,sans-serif}
.marquee-bar{position:sticky;top:0;z-index:10;height:42px;overflow:hidden;background:#f1f1f1;border-bottom:2px solid #f47725;display:flex;align-items:center;white-space:nowrap}
.marquee-bar span{display:inline-block;padding-left:100%;animation:scroll 18s linear infinite;color:#e96b1b;font-weight:700;font-size:18px;text-decoration:underline}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.image-wrap{width:100%;max-width:600px;margin:0 auto;background:#fff;position:relative}
.image-wrap img{display:block;width:100%;height:auto;object-fit:contain;}

.button-link{position:absolute;top:5.45%;height:3.05%;display:block;z-index:2;border-radius:14px}
.button-result{left:5.4%;width:27.0%}
.button-nims{left:34.7%;width:31.0%}
.button-login{left:68.0%;width:25.5%}
.button-link,.button-link:focus,.button-link:active{-webkit-tap-highlight-color:transparent;outline:none}
</style>
</head>
<body>
<div class="marquee-bar"><span>Click here to view CTS AITT Mains Examination</span></div>
<main class="image-wrap">
  <!-- અહીં તમારી ઇમેજની લિંક અથવા Base64 કોડ મૂકો -->
  <img src="તમારી_ઇમેજ_લિંક.jpg" alt="Trainee details screenshot">
  
  <a class="button-link button-result" href="https://dgt.skillindiadigital.gov.in/result" target="_blank" rel="noopener" aria-label="RESULT"></a>
  <a class="button-link button-nims" href="https://dgt.skillindiadigital.gov.in/" target="_blank" rel="noopener" aria-label="Instructor self registration on NIMS - official instructions"></a>
  <a class="button-link button-login" href="https://dgt.skillindiadigital.gov.in/" target="_blank" rel="noopener" aria-label="LOGIN"></a>
</main>
</body>
</html>
