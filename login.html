<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Scheme / Login</title><link rel="stylesheet" href="style.css"></head><body><main class="page narrow"><a class="back top" href="index.html">✕ Close</a><h1 class="center">Select Scheme</h1><div class="tabs"><button class="active" onclick="choose('CTS',this)">CTS</button><button onclick="choose('CITS',this)">CITS</button></div><h2 id="schemeTitle">CTS</h2><div class="roles" id="roles"></div><p class="note">Demo only: role cards do not authenticate users or connect to an official portal.</p><a class="back" href="index.html">← Back to Home</a></main><script>const roles=['Trainee','Instructor','ITI/NSTI Creator','ITI/NSTI Approver','NIMI Admin','Examiner','Nodal ITI','State-Examination','RDSDE','DGT TC Cell','DCT CD Cell','DCT TT Cell','DGT TT Cell','NPIU Creator','Examination Controller'];function choose(s,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('schemeTitle').textContent=s;render()}function render(){document.getElementById('roles').innerHTML=roles.map((r,i)=>`<button class="role" onclick="alert('Demo only: ${r} login is not connected.')"><span>◉</span><strong>${r}</strong><small>Login →</small></button>`).join('')}render();</script></body></html>
